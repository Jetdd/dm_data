[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-data"
version = "0.2.0"
description = "Local reader API for DM data, RiceQuant futures, and hot-concept mappings"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
    "duckdb>=0.9",
]

[project.optional-dependencies]
rq = ["rqdatac>=3.0"]
all = ["rqdatac>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
